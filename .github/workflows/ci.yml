name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/Jusoor.sln

      - name: Build
        run: dotnet build backend/Jusoor.sln --no-restore --configuration Release

      - name: Unit tests (Domain)
        run: dotnet test backend/tests/Jusoor.Domain.UnitTests/Jusoor.Domain.UnitTests.csproj --no-build --configuration Release

      - name: Unit tests (Application)
        run: dotnet test backend/tests/Jusoor.Application.UnitTests/Jusoor.Application.UnitTests.csproj --no-build --configuration Release

      - name: Unit tests (Infrastructure)
        run: dotnet test backend/tests/Jusoor.Infrastructure.UnitTests/Jusoor.Infrastructure.UnitTests.csproj --no-build --configuration Release

      # Integration tests need a Docker daemon for Testcontainers — available
      # on GitHub-hosted ubuntu-latest runners by default.
      - name: Integration tests
        run: dotnet test backend/tests/Jusoor.Api.IntegrationTests/Jusoor.Api.IntegrationTests.csproj --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
